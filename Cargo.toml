[workspace]
resolver = "2"
members = ["contracts/mindshield"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Profile used when compiling the deployable wasm artifact.
# `stellar contract build` / `cargo build --target wasm32-unknown-unknown --release`
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
